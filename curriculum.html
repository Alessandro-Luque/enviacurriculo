
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Envío de Curriculum Vitae</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 10px;
    background: #e9eef5;
    font-family: Arial, Helvetica, sans-serif;
    color: #333;
}

.contenedor {
    width: 100%;
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}

header {
    background: #164b7a;
    color: white;
    text-align: center;
    padding: 18px;
    border-radius: 5px;
    margin-bottom: 20px;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

header p {
    margin: 8px 0 0;
    font-size: 14px;
}

.seccion {
    border: 1px solid #cbd6e2;
    padding: 18px;
    margin-bottom: 18px;
    border-radius: 5px;
}

.seccion h2 {
    color: #164b7a;
    font-size: 17px;
    margin-top: 0;
    border-bottom: 2px solid #164b7a;
    padding-bottom: 8px;
}

label {
    display: block;
    font-weight: bold;
    font-size: 13px;
    margin: 12px 0 5px;
}

input[type="text"],
input[type="date"],
input[type="email"],
input[type="tel"],
textarea {
    width: 100%;
    padding: 9px;
    border: 1px solid #b9c6d3;
    border-radius: 4px;
    font-size: 14px;
}

textarea {
    resize: vertical;
    min-height: 75px;
}

.fila {
    display: flex;
    gap: 15px;
}

.campo {
    flex: 1;
    min-width: 0;
}

.foto-contenedor {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 15px 0;
}

.foto {
    width: 150px;
    height: 175px;
    border: 2px dashed #164b7a;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #164b7a;
    font-weight: bold;
    background: #f4f7fa;
    overflow: hidden;
}

.foto img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
}

.subir-foto {
    margin-top: 10px;
    padding: 8px 12px;
    background: #164b7a;
    color: white;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
}

.subir-foto input {
    display: none;
}

.botones {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.boton {
    display: inline-block;
    background: #164b7a;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 4px;
    font-size: 13px;
    text-decoration: none;
    cursor: pointer;
}

.boton:hover {
    background: #0d3558;
}

.boton-limpiar {
    background: #687786;
}

.boton-limpiar:hover {
    background: #4c5965;
}

footer {
    text-align: center;
    font-size: 12px;
    color: #666;
    margin-top: 25px;
    border-top: 1px solid #ddd;
    padding-top: 15px;
}

@media (max-width: 550px) {
    .contenedor {
        padding: 15px;
    }

    .fila {
        flex-direction: column;
        gap: 0;
    }
}
</style>
</head>

<body>

<div class="contenedor">

<header>
    <h1>CURRICULUM VITAE</h1>
    <p>Formulario de registro de datos personales y profesionales</p>
</header>

<form id="formularioCV" onsubmit="return enviarCurriculum(event)">

    <div class="seccion">
        <h2>1. DATOS PERSONALES</h2>

        <div class="foto-contenedor">
            <div class="foto">
                <span id="textoFoto">FOTO</span>
                <img id="vistaPrevia" alt="Vista previa de la fotografía">
            </div>

            <label class="subir-foto">
                SUBIR FOTO
                <input type="file" id="foto" accept="image/*" onchange="mostrarFoto(event)">
            </label>
        </div>

        <div class="fila">
            <div class="campo">
                <label>Apellidos:</label>
                <input type="text" name="apellidos" required>
            </div>

            <div class="campo">
                <label>Nombres:</label>
                <input type="text" name="nombre" required>
            </div>
        </div>

        <div class="fila">
            <div class="campo">
                <label>DNI:</label>
                <input type="text" name="dni" maxlength="8" required>
            </div>

            <div class="campo">
                <label>Fecha de nacimiento:</label>
                <input type="date" name="fecha">
            </div>
        </div>

        <label>Lugar de nacimiento:</label>
        <input type="text" name="lugar">

        <label>Dirección:</label>
        <input type="text" name="direccion">

        <div class="fila">
            <div class="campo">
                <label>Localidad:</label>
                <input type="text" name="localidad">
            </div>

            <div class="campo">
                <label>Provincia:</label>
                <input type="text" name="provincia">
            </div>
        </div>

        <div class="fila">
            <div class="campo">
                <label>Teléfono:</label>
                <input type="tel" name="telefono">
            </div>

            <div class="campo">
                <label>Móvil:</label>
                <input type="tel" name="movil">
            </div>
        </div>

        <label>Correo electrónico:</label>
        <input type="email" name="email" required>
    </div>

    <div class="seccion">
        <h2>2. FORMACIÓN Y ESTUDIOS</h2>

        <label>Titulación académica:</label>
        <textarea name="titulacion"></textarea>

        <label>Idiomas:</label>
        <textarea name="idiomas"></textarea>

        <label>Conocimientos de informática:</label>
        <textarea name="informatica"></textarea>

        <label>Cursos y capacitaciones:</label>
        <textarea name="cursos"></textarea>
    </div>

    <div class="seccion">
        <h2>3. EXPERIENCIA PROFESIONAL</h2>

        <label>Nombre de la empresa:</label>
        <input type="text" name="empresa">

        <label>Fecha de trabajo:</label>
        <input type="text" name="fecha_empresa">

        <label>Cargo desempeñado:</label>
        <input type="text" name="puesto">
    </div>

    <div class="seccion">
        <h2>4. DATOS COMPLEMENTARIOS</h2>

        <label>Información adicional:</label>
        <textarea name="complementarios"></textarea>

        <label>Lugar y fecha:</label>
        <input type="text" name="lugar_fecha">
    </div>

    <div class="botones">
        <button type="submit" class="boton">
            ENVIAR CURRICULUM
        </button>

        <button type="reset" class="boton boton-limpiar">
            LIMPIAR FORMULARIO
        </button>

        <a href="index.html" class="boton">
            VOLVER AL INICIO
        </a>
    </div>

</form>

<footer>
    © 2026 Alessandro @lesstech. Todos los derechos reservados.
</footer>

</div>

<script>
function mostrarFoto(event) {
    const archivo = event.target.files[0];
    const imagen = document.getElementById("vistaPrevia");
    const texto = document.getElementById("textoFoto");

    if (!archivo) {
        imagen.src = "";
        imagen.style.display = "none";
        texto.style.display = "block";
        return;
    }

    if (!archivo.type.startsWith("image/")) {
        alert("Por favor, selecciona un archivo de imagen.");
        event.target.value = "";
        return;
    }

    const lector = new FileReader();

    lector.onload = function(e) {
        imagen.src = e.target.result;
        imagen.style.display = "block";
        texto.style.display = "none";
    };

    lector.readAsDataURL(archivo);
}

function enviarCurriculum(event) {
    event.preventDefault();

    const formulario = document.getElementById("formularioCV");

    if (!formulario.checkValidity()) {
        formulario.reportValidity();
        return false;
    }

    alert(
        "Los datos del Curriculum Vitae fueron validados correctamente.\n\n" +
        "Esta página está publicada en GitHub Pages y todavía no tiene " +
        "un servicio conectado para recibir y almacenar los formularios."
    );

    return false;
}

document.getElementById("formularioCV").addEventListener("reset", function() {
    const imagen = document.getElementById("vistaPrevia");
    const texto = document.getElementById("textoFoto");

    imagen.src = "";
    imagen.style.display = "none";
    texto.style.display = "block";
});
</script>

</body>
</html>
